name: Build Windows Native Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if C sources exist
        id: check_c
        shell: bash
        run: |
          count=$(ls -1 *.c 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_c=true" >> "$GITHUB_OUTPUT"
            echo "Found $count C source files to compile for Windows."
          else
            echo "has_c=false" >> "$GITHUB_OUTPUT"
            echo "No C source files found."
          fi

      - name: Set up Python 3.12 (MSVC Toolchain)
        if: steps.check_c.outputs.has_c == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools
        if: steps.check_c.outputs.has_c == 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel cython

      - name: Compile Windows .pyd C-Binaries
        if: steps.check_c.outputs.has_c == 'true'
        run: |
          python setup_win.py build_ext --inplace

      - name: Set up Python 3.11 (Dual Compatibility)
        if: steps.check_c.outputs.has_c == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Windows Python 3.11 .pyd Binaries
        if: steps.check_c.outputs.has_c == 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel cython
          python setup_win.py build_ext --inplace

      - name: Purge C Sources & Intermediate Artifacts
        if: steps.check_c.outputs.has_c == 'true'
        shell: bash
        run: |
          rm -f *.c
          rm -rf build/
          rm -f setup_win.py

      - name: Commit and Push Windows Binaries to Release
        if: steps.check_c.outputs.has_c == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f *.pyd
          git add -u
          git commit -m "build(windows): auto-compiled native Windows .pyd binaries [skip ci]" || exit 0
          git push origin main
